[package]
name = "ups-update-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Update endpoint and download page for Unity Project Sync"
publish = false

[[bin]]
name = "update-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
